# Uso local. Não exponha estas portas na rede: a API não tem autenticação nem TLS
# e a senha padrão do banco vem do .env.example (ver spec 0003, seção 5).

x-tracelog-env: &tracelog-env
  APP_NAME: ${APP_NAME:-tracelog}
  APP_ENV: ${APP_ENV:-local}
  HTTP_PORT: "8080"
  # Dentro do container a API escuta em todas as interfaces para a porta publicada
  # funcionar; a publicação no host continua só em 127.0.0.1 (spec 0005, seção 4.7).
  HTTP_HOST: "0.0.0.0"
  HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
  # Dentro da rede do compose o banco é o serviço "postgres", sempre na 5432;
  # DB_HOST/DB_PORT do .env valem só para a CLI rodando no host.
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?defina DB_NAME no .env (copie o .env.example)}
  DB_USER: ${DB_USER:?defina DB_USER no .env (copie o .env.example)}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (copie o .env.example)}
  DB_SSLMODE: ${DB_SSLMODE:-disable}

x-tracelog-image: &tracelog-image
  image: tracelog:local
  build: .
  environment: *tracelog-env

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env (copie o .env.example)}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env (copie o .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (copie o .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tracelog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *tracelog-image
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  init:
    <<: *tracelog-image
    command: ["init", "--defaults"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *tracelog-image
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  tracelog_postgres_data:
